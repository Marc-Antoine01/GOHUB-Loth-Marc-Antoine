<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>S04 Entanglement</title>
  </head>
  <body>
    <template>
      <style>
      @font-face { font-family: PlexSans; font-weight: 300; src: url(assets/fonts/IBMPlexSans-Light.woff2) format('woff2'); }
      @font-face { font-family: PlexSans; font-weight: 400; src: url(assets/fonts/IBMPlexSans-Regular.woff2) format('woff2'); }
      @font-face { font-family: PlexSans; font-weight: 600; src: url(assets/fonts/IBMPlexSans-SemiBold.woff2) format('woff2'); }
      @font-face { font-family: PlexMono; font-weight: 400; src: url(assets/fonts/IBMPlexMono-Regular.woff2) format('woff2'); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s04-entanglement-gfx { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s04-entanglement-cam { position: absolute; inset: 0; }
        #s04-entanglement-cam .words, #s04-entanglement-cam .mono { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s04-entanglement" data-width="1920" data-height="1080">
        <canvas id="s04-entanglement-gfx"></canvas>
        <div id="s04-entanglement-cam">
          <div class="words" id="s04-entanglement-l1" data-x="120" data-y="290" data-size="128" data-color="ink" data-accent="blue">
            <span data-beat="34" class="accent">Entanglement.</span>
          </div>
          <div class="mono" id="s04-entanglement-c1" data-x="126" data-y="390" data-beat="37">// measure one, and you know the other</div>
          <div class="mono" id="s04-entanglement-c2" data-x="126" data-y="450" data-beat="40" data-offset="0.1">// however far apart</div>
        </div>
      </div>
      <script>
        // S04 Entanglement. Film time 14.9947–20.6213 s. Graphics: canvas, repainted from film time t by the timeline.
        // Text: the .words / .mono markup above (edit the words or their data-beat there).
        (() => {
          const { M, B, Bf, C } = Q, S = 14.9947, E = 20.6213, ID = 's04-entanglement';
          Q.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const g = Q.canvas(document.getElementById(`${ID}-gfx`)), cam = document.getElementById(`${ID}-cam`);
            const $ = (sel) => cam.querySelector(sel);
            const R = 130;
            function spinQubit(q, ang, pulse) {
              g.fillStyle = C.white; g.strokeStyle = C.gray80; g.lineWidth = 2;
              g.beginPath(); g.arc(q.x, q.y, R, 0, Math.PI * 2); g.fill(); g.stroke();
              if (pulse > 0 && pulse < 1) { g.strokeStyle = C.blue; g.lineWidth = 3 * (1 - pulse); g.beginPath(); g.arc(q.x, q.y, R * (1 + pulse * 1.2), 0, Math.PI * 2); g.stroke(); }
              g.save(); g.translate(q.x, q.y); g.rotate(ang);
              g.strokeStyle = C.blue; g.fillStyle = C.blue; g.lineWidth = 8; g.lineCap = 'round';
              g.beginPath(); g.moveTo(0, R * 0.55); g.lineTo(0, -R * 0.45); g.stroke();
              g.beginPath(); g.moveTo(0, -R * 0.68); g.lineTo(-R * 0.24, -R * 0.36); g.lineTo(R * 0.24, -R * 0.36); g.closePath(); g.fill();
              g.restore();
            }
            Q.push(tl, cam, S, S, B(44) - B(32), 1200, 640, 0.04);
            Q.wordsFrom(tl, S, $('#s04-entanglement-l1'));
            for (const id of ['c1', 'c2']) Q.monoFrom(tl, S, $(`#s04-entanglement-${id}`));
            Q.drive(tl, S, S, E, (t) => {
              const lt = t - S;
              Q.field(g, C.paper);
              Q.pushCanvas(g, lt, B(44) - B(32), 1200, 640, 0.04);
              const apart = M.ease.inOutCubic(M.range(t, B(37), Bf(39.5))) * 70; // they move apart between the two flips
              const A = { x: 700 - apart, y: 660 }, Bq = { x: 1640 + apart * 0.3, y: 660 };
              // The link: a standing wave between them, its amplitude breathing on the beat.
              const amp = 34 * (0.6 + 0.4 * Math.cos(((t - B(32)) / (B(33) - B(32))) * Math.PI * 2));
              const reach = M.ease.inOutCubic(M.range(t, B(32) + 0.1, B(34)));
              g.strokeStyle = C.blue40; g.lineWidth = 3;
              g.beginPath();
              for (let i = 0; i <= 200; i++) {
                const u = i / 200; if (u > reach) break;
                const x = M.lerp(A.x + R, Bq.x - R, u), y = A.y + Math.sin(u * Math.PI * 6 - t * 9) * amp * Math.sin(u * Math.PI);
                i ? g.lineTo(x, y) : g.moveTo(x, y);
              }
              g.stroke();
              // Both flip on the same frame on beat 36, and back together on beat 40.
              const flip = Math.max(0, M.spring(t - B(36), 2.6, 0.42)) - Math.max(0, M.spring(t - B(40), 2.6, 0.42));
              const pulse = t < B(40) ? M.range(t, B(36), B(36) + 0.5) : M.range(t, B(40), B(40) + 0.5);
              const inA = Math.max(0, M.spring(t - (B(32) + 0.2), 2.4, 0.5)), inB = Math.max(0, M.spring(t - B(33), 2.4, 0.5));
              g.save(); g.translate(A.x, A.y); g.scale(inA, inA); g.translate(-A.x, -A.y); spinQubit(A, Math.PI * flip, pulse); g.restore();
              g.save(); g.translate(Bq.x, Bq.y); g.scale(inB, inB); g.translate(-Bq.x, -Bq.y); spinQubit(Bq, Math.PI * (1 - flip) + Math.PI, pulse); g.restore();
            });
            window.__timelines[ID] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
