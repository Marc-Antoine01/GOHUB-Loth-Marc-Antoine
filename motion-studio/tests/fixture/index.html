<!doctype html>
<html><head><meta charset="utf-8">
<!-- Tooling fixture, not a film: exercises seek(t), seeded noise and the beat grid. -->
<style>html,body{margin:0;width:640px;height:360px;background:#0e0e0e;overflow:hidden}canvas{display:block}</style>
<script src="/lib/runtime.js"></script>
</head><body><canvas id="c" width="640" height="360"></canvas>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  window.seek = (t) => {
    ctx.clearRect(0, 0, 640, 360);
    const { index, since } = M.beatAt(t);
    const hit = 1 - M.ease.outCubic(M.range(since, 0, 0.3));
    for (let i = 0; i < 24; i++) {
      const h = 60 + 120 * (0.5 + 0.5 * M.noise1(i + 1, t * 0.8)) + (i === ((index % 24) + 24) % 24 ? 80 * hit : 0);
      ctx.fillStyle = i === ((index % 24) + 24) % 24 ? '#ff5a1f' : '#e8e4da';
      ctx.fillRect(20 + i * 25, 300 - h, 18, h);
    }
  };
</script></body></html>
